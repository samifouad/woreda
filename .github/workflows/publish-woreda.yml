name: Publish Woreda
run-name: "release woreda ${{ inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string
      preview:
        description: "Preview mode (no actual publish)"
        required: false
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - run: git fetch --force --tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Setup npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Configure git
        run: |
          git config --global user.email "woreda@local.dev"
          git config --global user.name "Woreda Release Bot"

      - name: Publish Woreda
        run: |
          chmod +x ./script/publish-woreda.ts
          ./script/publish-woreda.ts
        env:
          WOREDA_BUMP: ${{ inputs.bump }}
          WOREDA_VERSION: ${{ inputs.version }}
          WOREDA_CHANNEL: latest
          WOREDA_PREVIEW: ${{ inputs.preview }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
