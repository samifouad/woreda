name: Publish Woreda

on:
  push:
    tags:
      - 'v*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Update package versions
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Update all package.json files
          find . -name "package.json" -not -path "*/node_modules/*" -not -path "*/dist/*" | while read pkg; do
            echo "Updating $pkg to version $VERSION"
            bun run -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$pkg', 'utf8'));
              pkg.version = '$VERSION';
              fs.writeFileSync('$pkg', JSON.stringify(pkg, null, 2) + '\n');
            "
          done

      - name: Build package
        run: cd packages/opencode && bun run build

      - name: Setup npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish to npm
        run: cd packages/opencode && npm publish --access public --tag latest

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -A1 "^${GITHUB_REF#refs/tags/}$" | tail -1)

          if [ -z "$PREV_TAG" ]; then
            echo "changelog=Initial release of Woreda - Ollama-first AI coding agent" >> $GITHUB_OUTPUT
          else
            # Generate changelog from commits
            CHANGELOG=$(git log $PREV_TAG..HEAD --oneline --format="%s" | grep -v "chore:\|ci:\|test:" | sed 's/^/- /' | head -20)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- Minor updates and improvements"
            fi
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release create v$VERSION \
            --title "v$VERSION" \
            --notes "${{ steps.changelog.outputs.changelog }}" \
            --verify-tag

      - name: Announce release
        run: |
          echo "🎉 Woreda v${{ steps.version.outputs.version }} published!"
          echo "📦 npm: https://www.npmjs.com/package/woreda"
          echo "🐙 GitHub: https://github.com/samifouad/woreda/releases/tag/v${{ steps.version.outputs.version }}"

